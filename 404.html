<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Студия Лексикон</title>
    <script>
      (function () {
        var path = location.pathname;
        // на github.io сайт живёт в папке /studiya-leksikon, на lexicon-school.ru — в корне
        var repo = path.indexOf("/studiya-leksikon") === 0 ? "/studiya-leksikon" : "";
        var rest = repo ? path.slice(repo.length) : path;
        location.replace(repo + "/#" + (rest || "/"));
      })();
    </script>
  </head>
  <body></body>
</html>

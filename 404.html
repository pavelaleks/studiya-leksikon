<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Студия Лексикон</title>
    <script>
      (function () {
        var path = location.pathname;
        var repo = "/studiya-leksikon";
        var rest = path.indexOf(repo) === 0 ? path.slice(repo.length) : path;
        location.replace(repo + "/#" + (rest || "/"));
      })();
    </script>
  </head>
  <body></body>
</html>

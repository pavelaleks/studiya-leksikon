<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Студия Лексикон</title>
    <script>
      (function () {
        var path = location.pathname;
        // на github.io сайт живёт в папке /studiya-leksikon, на lexicon-school.ru — в корне
        var repo = /github\.io$/.test(location.hostname) ? "/studiya-leksikon" : "";
        var rest = path.replace(/^\/studiya-leksikon/, "").replace(/\/index\.html$/, "/");
        if (rest === "/" || rest === "") rest = "/";
        location.replace(repo + "/#" + rest);
      })();
    </script>
  </head>
  <body></body>
</html>

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unlock exercise bank
        env:
          LEKSIKON_BANK_KEY: ${{ secrets.LEKSIKON_BANK_KEY }}
        run: python tools/bank.py unlock
      - name: Collect site files
        run: |
          mkdir -p _site/css _site/js _site/data
          cp index.html 404.html favicon.svg manifest.webmanifest _site/
          cp -r icons _site/icons
          cp -r css/. _site/css/
          cp -r js/. _site/js/
          # Банк заданий с ответами живёт в Supabase. На сайт уходят только манифесты и картинки.
          rm -rf _site/js/russian-data/problems _site/js/russian-data/passages _site/js/russian-data/bank
          rm -rf _site/js/oge-data/problems _site/js/oge-data/passages _site/js/oge-data/bank
          rm -rf _site/js/literature-data/bank _site/js/literature-data/index.json
          ! grep -rlE --include='*.json' '"(solutionHtml|answerNorm)"' _site/js || (echo "В публикацию попали ответы" && exit 1)
          cp data/orthography.json data/punctuation.json data/stylistics.json data/exercises.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      # deploy-pages иногда не находит только что загруженный артефакт — ждём и пробуем ещё раз.
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 45
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - id: deployment
        run: echo "page_url=${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}" >> "$GITHUB_OUTPUT"
